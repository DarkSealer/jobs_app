# Copy to config.yaml and customize (config.yaml is gitignored).
# Example profile only — replace with your real details locally.

profile:
  name: "Your Name"
  email: "you@example.com"

  description: |
    Replace with your professional summary, years of focus, and technologies
    you want to match against job postings.

  experience_years: 5

  skills:
    - Python
    - Git
    - REST APIs

  job_titles:
    - Software Engineer
    - Senior Software Engineer

  projects:
    - name: "Sample CLI Tool"
      description: "A small command-line utility demonstrating parsing and file I/O."
      technologies:
        - Python
        - YAML

# Search Preferences
search:
  locations:
    - "Remote"
    - "United States"

  radius_miles: 0
  include_remote: true
  remote_only: false

  job_types:
    - full-time
    - contract

  experience_levels:
    - mid-level
    - senior

  min_salary: 80000

  priority_keywords:
    - "remote"
    - "python"
    - "api"

  exclude_keywords:
    - "internship"
    - "junior"
    - "entry level"
    - "on-site"
    - "onsite"
    - "hybrid"

